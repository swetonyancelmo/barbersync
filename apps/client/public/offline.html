<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3a33" />
    <title>Sem conexão — BarberSync</title>
    <style>
      :root { color-scheme: light dark; }
      html, body {
        margin: 0; min-height: 100%;
        background: #ece9dd; color: #26241c;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex; align-items: center; justify-content: center;
      }
      @media (prefers-color-scheme: dark) {
        html, body { background: #14110b; color: #efe7d6; }
        .card { background: #1f1b14 !important; border-color: #3a3226 !important; }
        .muted { color: #a49b88 !important; }
      }
      .card {
        background: #fcfbf7; border: 1px solid #d9d5c4; border-radius: 10px;
        padding: 32px 28px; margin: 20px; max-width: 340px; text-align: center;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }
      .mark {
        width: 56px; height: 56px; border-radius: 14px; background: #1e3a33;
        display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px;
      }
      h1 { font-size: 20px; margin: 0 0 6px; }
      .rule {
        height: 4px; width: 56px; margin: 10px auto 16px; border-radius: 2px;
        background: linear-gradient(90deg, #c0392b 0 33%, #f3ecd9 33% 66%, #23406b 66% 100%);
      }
      .muted { color: #6e6a5b; font-size: 14px; line-height: 1.55; margin: 0; }
      button {
        margin-top: 20px; width: 100%; padding: 11px 16px; font-size: 15px; font-weight: 600;
        color: #f3ecd9; background: #c0392b; border: none; border-radius: 999px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="mark">
        <!-- Ícone oficial (barbersync-brand/svg/barbersync-icon-dark-bg.svg) -->
        <svg width="34" height="34" viewBox="0 0 120 120" aria-hidden="true">
          <line x1="46" y1="86" x2="78" y2="14" stroke="#F0E6D2" stroke-width="7" stroke-linecap="round"/>
          <line x1="74" y1="86" x2="42" y2="14" stroke="#F0E6D2" stroke-width="7" stroke-linecap="round"/>
          <path d="M29.2 97.9 A11 11 0 1 1 34.5 105.5" fill="none" stroke="#5E9C86" stroke-width="6" stroke-linecap="round"/>
          <polygon points="28.4,102 37,101.2 32,109.8" fill="#5E9C86"/>
          <path d="M90.8 97.9 A11 11 0 1 0 85.5 105.5" fill="none" stroke="#5E9C86" stroke-width="6" stroke-linecap="round"/>
          <polygon points="91.6,102 83,101.2 88,109.8" fill="#5E9C86"/>
          <circle cx="60" cy="54.5" r="5.5" fill="#D9503F"/>
        </svg>
      </span>
      <h1>Sem conexão</h1>
      <div class="rule"></div>
      <p class="muted">
        Não foi possível carregar o BarberSync. Verifique sua internet e tente de novo.
      </p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
